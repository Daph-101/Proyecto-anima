<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ventas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand-lg bg-dark border-bottom border-warning border-4"
      >
        <div class="container">
          <a class="navbar-brand" href="/index.html">
            <img
              src="/img/automotora_vip_logo.png"
              alt="logo"
              style="height: 15px"
          /></a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div
            class="collapse navbar-collapse d-flex justify-content-end"
            id="navbarNav"
          >
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Venta 0km</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Venta usados</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white-50" href="#">Sobre nosotros</a>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled text-white-50" aria-disabled="true"
                  >Contacto</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <div class="container">
      <div class="row mt-5 d-flex flex-column align-items-start">
        <!-- Sección Ventas -->
        <div
          class="border-bottom border-2 mb-3 w-100 d-flex justify-content-between align-items-end"
        >
          <h3 class="mb-0">Ventas</h3>
          <p class="text-end mb-0">
            <i class="bi bi-arrow-left-right"></i> UYU/USD 28.38
          </p>
        </div>

        <!-- Formulario de Filtro -->
        <div class="col-12 col-md-4">
          <form class="bg-light p-3 rounded shadow-sm">
            <p class="border-bottom fw-bold">Filtro</p>

            <div class="mb-3">
              <label for="año" class="form-label">Año</label>
              <select class="form-select" id="anio" name="anio">
                <option selected disabled>Selecciona un año</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="marca" class="form-label">Marca</label>
              <select class="form-select" id="marca" name="marca">
                <option selected disabled>Selecciona una marca</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="modelo" class="form-label">Modelo</label>
              <select class="form-select" id="modelo" name="modelo">
                <option selected disabled>Selecciona un modelo</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="estado" class="form-label">Estado</label>
              <select class="form-select" id="estado" name="estado">
                <option selected disabled>Selecciona un estado</option>
              </select>
            </div>

            <div class="mb-3">
              <button type="submit" class="btn btn-warning w-100 text-white">
                <i class="bi bi-search me-2"></i>Filtrar
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
